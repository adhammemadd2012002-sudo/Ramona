<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <title>The Moon Found His Sun</title>
  <meta name="description" content="The Moon Found His Sun — An illustrated celestial storybook experience.">
  <meta name="theme-color" content="#10142B">

  <!-- Open Graph / Social Meta -->
  <meta property="og:title" content="The Moon Found His Sun">
  <meta property="og:description" content="A personal, illustrated celestial storybook.">
  <meta property="og:type" content="website">

  <!-- Favicon (Relative Path for GitHub Pages Compatibility) -->
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/chapters.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-active-chapter="1">
  <!-- Layered Celestial Atmosphere & Subtle Paper Grain -->
  <div class="celestial-background" aria-hidden="true">
    <div class="ambient-sky-gradient"></div>
    <div class="ambient-stars ambient-stars--deep"></div>
    <div class="ambient-stars ambient-stars--mid"></div>
    <div class="paper-grain-overlay"></div>
  </div>

  <!-- Primary Application Shell -->
  <div class="app-container">
    <!-- Top Editorial Header Landmark -->
    <header class="site-header" role="banner">
      <div class="site-header__container">
        <a href="#opening-hero" class="site-header__brand" aria-label="The Moon Found His Sun — Return to opening">
          <span class="site-header__title">The Moon Found His Sun</span>
          <span class="site-header__subtitle" lang="ar" dir="rtl">حكاية قمر وشمس</span>
        </a>
        <div class="site-header__ornament" aria-hidden="true">
          <span class="ornament-star">✦</span>
        </div>
      </div>
    </header>

    <!-- Main Landmark -->
    <main id="story-main" class="story-main" role="main">
      <!-- =============================================================== -->
      <!-- CINEMATIC OPENING EXPERIENCE (Floating Storybook & Butterfly)   -->
      <!-- =============================================================== -->
      <section id="opening-hero" class="opening-hero" aria-labelledby="hero-main-title">
        <div class="opening-hero__inner">
          <div class="opening-hero__header">
            <span class="hero-eyebrow">A Celestial Storybook</span>
            <h1 id="hero-main-title" class="hero-title">The Moon Found His Sun</h1>
            <p class="hero-subtitle-ar" lang="ar" dir="rtl">حكاية في عالم النجوم والمجرات</p>
          </div>

          <!-- Interactive Floating Storybook SVG Mount -->
          <div
            id="opening-book-stage"
            class="opening-book-stage"
            role="button"
            tabindex="0"
            aria-label="Illustrated celestial storybook with a golden butterfly. Activate to open the story."
          ></div>

          <!-- Primary CTA to Open the Book and Enter Chapter 1 -->
          <div class="opening-hero__actions">
            <button
              id="open-story-btn"
              class="open-story-cta"
              type="button"
              aria-expanded="false"
              aria-controls="chapter-mount"
            >
              <span class="open-story-cta__en">Open the Story</span>
              <span class="open-story-cta__divider" aria-hidden="true">✦</span>
              <span class="open-story-cta__ar" lang="ar" dir="rtl">افتح الحكاية</span>
            </button>
          </div>
        </div>
      </section>

      <!-- =============================================================== -->
      <!-- ALL 13 CHAPTER SCENES MOUNT POINT                               -->
      <!-- =============================================================== -->
      <div id="chapter-mount" class="story-journey-container" aria-live="polite">
        <noscript>
          <div class="chapter-narrative-card text-center">
            <h2 class="chapter-header__title">JavaScript Required</h2>
            <p class="story-text" style="text-align: center; direction: ltr;">
              Please enable JavaScript in your browser to experience this illustrated story.
            </p>
          </div>
        </noscript>
      </div>
    </main>

    <!-- ================================================================= -->
    <!-- PERSISTENT CONSTELLATION NAVIGATION BAR                           -->
    <!-- ================================================================= -->
    <nav class="story-navigation" role="navigation" aria-label="Chapter Navigation">
      <!-- Top Progress Line -->
      <div
        id="chapter-progress-bar-track"
        class="chapter-progress-track"
        role="progressbar"
        aria-label="Story reading progress"
        aria-valuemin="1"
        aria-valuemax="13"
        aria-valuenow="1"
      >
        <div id="chapter-progress-bar" class="chapter-progress-bar" style="width: 7.7%;"></div>
      </div>

      <div class="navigation-controls" dir="ltr">
        <button id="prev-chapter-btn" class="nav-btn nav-btn--prev" type="button" aria-label="Previous Chapter" disabled>
          <span class="nav-btn__arrow" aria-hidden="true">&larr;</span>
          <span class="nav-btn__text">Prev</span>
        </button>

        <div class="navigation-center">
          <div id="constellation-dots" class="constellation-dots" role="group" aria-label="Jump to chapter"></div>
          <span id="chapter-indicator" class="chapter-counter" aria-live="off">
            Chapter 01 / 13 — The Invitation
          </span>
        </div>

        <button id="next-chapter-btn" class="nav-btn nav-btn--next" type="button" aria-label="Next Chapter">
          <span class="nav-btn__text">Next</span>
          <span class="nav-btn__arrow" aria-hidden="true">&rarr;</span>
        </button>
      </div>
    </nav>

    <!-- Footer Landmark -->
    <footer class="site-footer" role="contentinfo">
      <p class="site-footer__text" dir="ltr">The Moon Found His Sun &mdash; A Celestial Story</p>
    </footer>
  </div>

  <!-- Application Scripts (Ordered for both file:// and HTTP/HTTPS compatibility) -->
  <script defer src="src/content/story.js"></script>
  <script defer src="js/characters.js"></script>
  <script defer src="js/scenes.js"></script>
  <script defer src="js/animations.js"></script>
  <script defer src="js/accessibility.js"></script>
  <script defer src="js/interactions.js"></script>
  <script defer src="js/navigation.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
